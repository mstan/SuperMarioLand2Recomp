    version:new File(game,'VERSION').text.trim(),versionCode:200,romCrc:'d5ec24e4',romSize:524288,
    dx:true,console:'gb',target:'Super_Mario_Land_2',generatedDir:'generated',
    gameRoot:game,engineRoot:engine,uiRoot:file(providers.gradleProperty('gbcUiRoot').orElse('../recomp-ui').get())]
