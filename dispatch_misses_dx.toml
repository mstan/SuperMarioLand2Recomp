# Tier-0 dispatch-miss manifest — runtime-confirmed interpreter
# fallbacks fed back to the recompiler as entry-point seeds. Each
# address provably executed as an opcode (zero false positives).
# ROM-only (addr < 0x8000); RAM/HRAM code is handled by runtime stubs.
# Generated by: gbrecomp --harvest <interp_fallbacks.log> [--manifest <file>]
# Auto-ingested when sitting next to the config.
#
# DX body (V1.0 + sml2dx_v181.bps). Seeds are NOT shared with the faithful
# body: the DX image relocates code (e.g. the actor draw routine moves from
# bank 3 to a dynamic {35,40,58}). Harvest against the DX body only.
#
# RESET 2026-09-16 for the V1.0 re-base. The previous 613 seeds were harvested
# on the (UE) V1.2 image; bank 0 of V1.2 is V1.0 shifted by +3 over file
# 0x0049C-0x0383D (and +11 over 0x0387D-0x03951), so those addresses do not
# transfer — a seed landing mid-instruction would manufacture a bogus function.
# Re-harvest on V1.0 with tools/probe_adaptive.py's route:
#   Super_Mario_Land_2.exe --input <route>          (writes interp_fallbacks.log)
#   gbrecomp --harvest interp_fallbacks.log --manifest dispatch_misses.toml
