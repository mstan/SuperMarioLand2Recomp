# Super Mario Land 2 - 6 Golden Coins (UE) (V1.0) — faithful body.
#
# V1.0 is the ONE ROM this project asks the user for (CRC32 D5EC24E4). The DX
# body (super_mario_land_2_dx.toml) is derived from the very same file by the
# SML2 DX v1.8.1 BPS, applied in memory at boot — so there is exactly one
# supported cart and exactly one CRC in the launcher gate.
#
# Used with: gbrecomp --config super_mario_land_2.toml

[rom]
path = "roms/Super Mario Land 2 - 6 Golden Coins (UE) (V1.0) [!].gb"
output_dir = "generated"
runtime_dir = "../gb-recompiled/runtime"
valid_crcs = [0xD5EC24E4]
output_prefix = "Super_Mario_Land_2"
# froggestspirit/marioland2, ingested by tools/ingest_disasm.py. Validated
# against V1.0 on the headless Level-1 route: fallback sites 53 -> 52 (a strict
# subset, no new sites), identical camera travel and mode. NOT shared with the
# DX body -- the hack relocates code, so its symbols would be wrong.
symbols = "recomp/sml2_v10.sym"

[options]
# Explicit rather than relying on the sibling auto-discovery, so it is obvious
# this body does NOT share seeds with the DX one. Re-harvested on V1.0 (617
# sites): the previous 613 came from V1.2, whose bank 0 is this one shifted +3
# over 0x0049C-0x0383D, so those addresses would land mid-instruction here.
dispatch_misses = "dispatch_misses.toml"
aggressive_scan = true
emit_comments = true
# This tree is the primary project of a two-body executable: its main() boots
# whichever body the launcher's Mods page selected. See DX.md and
# gb-recompiled/runtime/include/gb_body.h.
multi_body = true

# The horizontal despawn compare in Mario's fireball update, 00:327E `cp $C0`.
# Its inputs are all modulo 256 (camera LOW byte, slot X LOW byte, +80, and
# $F0), so a wider reach is not expressible by lying about them -- only by the
# compared immediate. sml2_adaptive.c installs gbrt_imm_override_hook only when
# the widescreen mod is on, and it hands the ROM's own $C0 straight back unless
# Enemy spawns = Extended, so the default build behaves exactly as the literal
# did. See sml2_map.h (SML2_FB_CP_X_PC) and ADAPTIVE.md.
[[imm_override]]
bank = 0
addr = 0x327E
note = "fireball horizontal despawn window (Extended reach)"
